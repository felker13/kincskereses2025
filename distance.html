<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Élő távolságmérés GPS alapján</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 2em; }
    #result { margin-top: 1em; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Élő távolság a célponttól</h1>
  <p>Cél: <strong>47.7102776, 19.1279354</strong></p>
  <div id="result">Helyzet lekérése...</div>

  <script>
    const targetLat = 47.7102776;
    const targetLon = 19.1279354;

    function getDistanceFromLatLonInMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000; // Föld sugara méterben
      const toRad = deg => deg * Math.PI / 180;

      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);

      const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLon / 2) ** 2;

      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    const resultDiv = document.getElementById('result');

    function updatePosition() {
      if (!navigator.geolocation) {
        resultDiv.textContent = 'A böngésző nem támogatja a helymeghatározást.';
        resultDiv.style.color = 'red';
        return;
      }

      navigator.geolocation.getCurrentPosition(
        position => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          const acc = position.coords.accuracy;
          const distance = getDistanceFromLatLonInMeters(lat, lon, targetLat, targetLon);

          resultDiv.innerHTML = `
            Saját helyzeted: ${lat.toFixed(6)}, ${lon.toFixed(6)}<br>
            Pontosság: ±${acc.toFixed(1)} méter<br>
            Távolság a célponttól: ${distance.toFixed(2)} méter<br>
            ${distance <= 20
              ? '<span style="color:green">✅ 20 méteren belül vagy.</span>'
              : '<span style="color:red">❌ Több mint 20 méterre vagy.</span>'}
          `;
        },
        error => {
          resultDiv.textContent = 'Helymeghatározási hiba: ' + error.message;
          resultDiv.style.color = 'red';
        },
              {
                enableHighAccuracy: true,
                timeout: 5000,
                maximumAge: 0
              }
      );
    }

    // Frissítés 1 másodpercenként
    setInterval(updatePosition, 1000);
  </script>
</body>
</html>
